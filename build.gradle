buildscript {
	repositories {
		mavenCentral()
	}
}

plugins {
	id 'java'
	id 'org.springframework.boot' version '3.5.3'
	id 'io.spring.dependency-management' version '1.1.7'
	id 'com.google.protobuf' version '0.9.4'
	id 'io.sentry.jvm.gradle' version '6.23.0'
}

group = 'com.arcyriea-loreverse'
version = '0.0.1-SNAPSHOT'

def grpcVersion = '1.75.0'
def protobufVersion = '3.25.3'

java {
	toolchain {
		languageVersion = JavaLanguageVersion.of(21)
	}
}

configurations {
	compileOnly {
		extendsFrom annotationProcessor
	}
}

repositories {
	mavenCentral()
}

dependencies {
	// ==========================================
	// Core Spring Boot & System Starters
	// ==========================================
	implementation 'org.springframework.boot:spring-boot-starter-web'
	implementation 'org.springframework.boot:spring-boot-starter-websocket'
	implementation 'org.springframework.boot:spring-boot-starter-security'
	implementation 'org.springframework.boot:spring-boot-starter-validation'
	implementation 'org.springframework.boot:spring-boot-starter-actuator'
	implementation 'org.springframework.boot:spring-boot-starter-aop'
	implementation 'org.springframework.retry:spring-retry'

	// ==========================================
	// Persistence & Databases (SQL / NoSQL / Cache)
	// ==========================================
	implementation 'org.springframework.boot:spring-boot-starter-data-jpa'
	implementation 'org.hibernate.orm:hibernate-core:6.4.4.Final'

	// Relational Database Drivers
	implementation 'com.mysql:mysql-connector-j'
	implementation 'org.mariadb.jdbc:mariadb-java-client'

	// Oracle Database & Wallet Stack
	implementation platform('com.oracle.database.jdbc:ojdbc11-production:23.4.0.24.05')
	implementation 'com.oracle.database.jdbc:ojdbc11'
	implementation 'com.oracle.database.jdbc:ucp'
	implementation 'com.oracle.database.spring:oracle-spring-boot-starter-wallet:25.3.0'
	implementation 'com.oracle.database.security:oraclepki:23.8.0.25.04'
	implementation 'com.oracle.database.security:osdt_core:21.18.0.0'
	implementation 'com.oracle.database.security:osdt_cert:21.18.0.0'

	// MongoDB Data Access
	implementation 'org.springframework.boot:spring-boot-starter-data-mongodb'
	implementation platform('org.mongodb:mongodb-driver-bom:5.5.1')
	implementation 'org.mongodb:mongodb-driver-sync'

	// Redis Data Access & Embedded Cache
	implementation 'org.springframework.boot:spring-boot-starter-data-redis'
	implementation 'cn.ponfee:embedded-redis:1.5'

	// ==========================================
	// Security & Authentication (JWT)
	// ==========================================
	implementation 'io.jsonwebtoken:jjwt-api:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-impl:0.12.6'
	runtimeOnly 'io.jsonwebtoken:jjwt-jackson:0.12.6'

	// ==========================================
	// External APIs & Live Stream Integrations
	// ==========================================
	implementation 'com.github.twitch4j:twitch4j:1.12.0'
	implementation 'com.google.api-client:google-api-client:2.7.2'
	implementation 'com.google.apis:google-api-services-youtube:v3-rev20260902-2.0.0'

	// ==========================================
	// WebJars & Frontend Assets
	// ==========================================
	implementation 'org.webjars:sockjs-client:1.0.2'
	implementation 'org.webjars:stomp-websocket:2.3.3'
	implementation 'org.webjars:bootstrap:5.0.0-beta1'
	implementation 'org.webjars:jquery:3.5.0'

	// ==========================================
	// gRPC & Protobuf Dependencies
	// ==========================================
	implementation "io.grpc:grpc-netty-shaded:${grpcVersion}"
	implementation "io.grpc:grpc-protobuf:${grpcVersion}"
	implementation "io.grpc:grpc-stub:${grpcVersion}"
	implementation 'javax.annotation:javax.annotation-api:1.3.2'

	// ==========================================
	// Tooling, Observability & OpenAPI
	// ==========================================
	implementation 'org.springdoc:springdoc-openapi-starter-webmvc-ui:2.8.6'
	implementation 'io.sentry:sentry-spring-boot-starter-jakarta:8.59.0'
	developmentOnly 'org.springframework.boot:spring-boot-devtools'

	// Annotation Processors (Lombok)
	compileOnly 'org.projectlombok:lombok'
	annotationProcessor 'org.projectlombok:lombok'

	// ==========================================
	// Testing Scope
	// ==========================================
	testImplementation 'org.springframework.boot:spring-boot-starter-test'
	testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
}

protobuf {
    protoc {
        artifact = "com.google.protobuf:protoc:${protobufVersion}"
    }
    plugins {
        grpc {
            artifact = "io.grpc:protoc-gen-grpc-java:${grpcVersion}"
        }
    }
    generateProtoTasks {
        all().each { task ->
            task.plugins {
                grpc {}
            }
        }
    }
}

sentry {
	includeSourceContext = true
	org = "lythiarienas-royal-codebase"
	projectName = "java-spring-boot"

	// Resolves token safely without breaking builds if missing locally
	authToken = System.getenv("SENTRY_AUTH_TOKEN") ?: ""
}

// FIX: Force Sentry bundle tasks to depend on Protobuf code generation
tasks.matching { it.name.startsWith('generateSentryBundleId') }.configureEach {
	dependsOn 'generateProto'
}

tasks.named('test') {
	useJUnitPlatform()
}

configurations.all {
	resolutionStrategy.eachDependency { DependencyResolveDetails details ->
		if (details.requested.group == 'io.sentry') {
			details.useVersion '8.59.0'
		}
	}
}
