spring:
  application:
    name: Arcyriea-Loreverse-Oracle-Backend
  datasource:
    mysql:
      enabled: true
    oracle:
      enabled: false

  # CRITICAL: Disable global JPA and DataSource auto-configuration
  # We will manually configure JPA for each datasource
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.orm.jpa.HibernateJpaAutoConfiguration
      - org.springframework.boot.autoconfigure.jdbc.DataSourceAutoConfiguration

  # Existing MongoDB and Redis configurations (not managed by JPA auto-config)
  data:
    mongodb:
      uri: ${MONGODB_URL:mongodb://localhost:27017/arcyriea-loreverse}
      auto-index-creation: true
    redis:
      host: localhost
      port: 6379

# Custom configurations for multiple datasources
custom:
  listener:
    twitch:
      enabled: false
    youtube:
      enabled: false
    kick:
      enabled: false

  datasource:
    mysql:
      url: ${MYSQL_URL} #jdbc:mysql://localhost:3306/loreverse_test?createDatabaseIfNotExists=true
      username: ${MYSQL_USERNAME:root}
      password: ${MYSQL_PASSWORD:123456}
      driver-class-name: com.mysql.cj.jdbc.Driver
      jpa:
        hibernate:
          ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.MySQLDialect

    mariadb:
      url: ${MARIADB_URL} #jdbc:mariadb://localhost:3308/arcyriea-loreverse-test
      username: ${MARIADB_USERNAME:root}
      password: ${MARIADB_PASSWORD:123456}
      driver-class-name: org.mariadb.jdbc.Driver
      jpa:
        hibernate:
          ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.MariaDBDialect

    oracle-adw:
      url: ${ORACLE_ADW_URL:jdbc:oracle:thin:@localhost:1521/LOREVERSE_TEST}
      username: ${ORACLE_ADW_USERNAME:arcyriea}
      password: ${ORACLE_ADW_PASSWORD:Nanana1029}
      driver-class-name: oracle.jdbc.OracleDriver
      wallet: false
      jpa:
        hibernate:
          ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.OracleDialect

    oracle-atp:
      url: ${ORACLE_ATP_URL:jdbc:oracle:thin:@localhost:1521/LOREVERSE_TEST}
      username: ${ORACLE_ATP_USERNAME:arcyriea}
      password: ${ORACLE_ATP_PASSWORD:Nanana1029}
      driver-class-name: oracle.jdbc.OracleDriver
      wallet: false
      jpa:
        hibernate:
          ddl-auto: update
        show-sql: true
        database-platform: org.hibernate.dialect.OracleDialect

